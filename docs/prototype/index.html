<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a phone-shaped app centered on the page, with a presenter's demo guide beside it on wide screens. */
:root{
  --bg:#e8e6ee; --frame:#1d1625; --surface:#fbfafd; --card:#ffffff; --ink:#1b1423; --muted:#6a6177; --line:#e4e0eb;
  --accent:#57068c; --accent-ink:#ffffff; --accent-soft:#f0e6f8;
  --amber:#9a5b00; --amber-soft:#fbefd8; --good:#1b7a51; --good-soft:#e0f2e9; --bad:#b0372b; --bad-soft:#fae5e2;
  --glow:#ffd23f; --glow-ink:#2b1e00;
  --map-bg:#efedf3; --map-street:#ffffff; --map-park:#d4e8d6; --map-path:#bcd8c0; --map-bldg:#dcd4e6; --map-campus:#e6dcf0; --logo-bg:transparent;
  --shadow:0 40px 70px -40px rgba(45,20,70,.45);
  --f-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0a11; --frame:#2c2436; --surface:#15111b; --card:#1f1927; --ink:#f1ecf7; --muted:#a59cb1; --line:#2f2839;
  --accent:#c79de8; --accent-ink:#1d0b2b; --accent-soft:#2c1e3b;
  --amber:#f0b45c; --amber-soft:#382810; --good:#62cf9a; --good-soft:#133224; --bad:#f08b7d; --bad-soft:#3a1915;
  --map-bg:#1a1622; --map-street:#2b2435; --map-park:#1d3125; --map-path:#284230; --map-bldg:#2b2437; --map-campus:#2a2038; --logo-bg:#f5f0fc;
  --shadow:0 40px 70px -40px rgba(0,0,0,.8); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d0a11; --frame:#2c2436; --surface:#15111b; --card:#1f1927; --ink:#f1ecf7; --muted:#a59cb1; --line:#2f2839;
  --accent:#c79de8; --accent-ink:#1d0b2b; --accent-soft:#2c1e3b;
  --amber:#f0b45c; --amber-soft:#382810; --good:#62cf9a; --good-soft:#133224; --bad:#f08b7d; --bad-soft:#3a1915;
  --map-bg:#1a1622; --map-street:#2b2435; --map-park:#1d3125; --map-path:#284230; --map-bldg:#2b2437; --map-campus:#2a2038; --logo-bg:#f5f0fc;
  --shadow:0 40px 70px -40px rgba(0,0,0,.8); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;height:100%}
/* iPhone-style frame: 393pt wide screen, titanium band, Dynamic Island, home indicator */
.phone{position:relative;flex:none;width:min(417px,100%);height:min(876px,100%);background:var(--surface);
  border:12px solid #111014;border-radius:64px;box-shadow:0 0 0 2px #4a4650,0 0 0 4px #1e1c22,var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:20px;background:#000;z-index:70;pointer-events:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:70;pointer-events:none}
.statusbar{flex:none;height:54px;padding:6px 30px 0 34px;display:flex;align-items:center;justify-content:space-between;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;font-size:16px;font-weight:600;letter-spacing:-.01em}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.statusbar svg{display:block;fill:currentColor}
.screen{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 28px;display:flex;flex-direction:column;gap:16px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-bottom:22px}
.tabbar button{border:0;background:none;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--muted);position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--accent);font-weight:600}
.tabbar .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;line-height:16px;padding:0 4px}

.appicon{width:20px;height:20px;border-radius:6px;background:var(--accent-soft) center/115% no-repeat;flex:none;display:block}
.mascot{display:block;height:auto;max-width:100%;background:var(--logo-bg);border-radius:50%}
.pop{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.pop img{width:150px;animation:popin .45s cubic-bezier(.2,.9,.3,1.4)}
.pop b{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.03em;color:var(--accent);animation:popin .45s .08s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes popin{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:68px;line-height:.95;letter-spacing:-.03em;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.2;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{margin:0;font-size:15.5px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:8px 12px;border-radius:11px;font-size:13px}
.btn.nado{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;padding:9px 18px;border-radius:999px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.input{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;width:100%}
.err{color:var(--bad);font-size:13px}
.code{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.code input{width:100%;aspect-ratio:4/5;max-width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;text-align:center;font-family:var(--f-mono);font-size:24px;font-weight:600}
.code input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.code.bad input{border-color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--accent-soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.toggle{position:relative;width:44px;height:26px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .2s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{transform:translateX(18px)}
.toggle input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}

.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}

.grid{display:grid;grid-template-columns:30px repeat(7,1fr);gap:2px;user-select:none;-webkit-user-select:none}
.grid.editable{touch-action:none}
.grid .hd{font-size:11px;font-weight:600;text-align:center;color:var(--muted);padding-bottom:2px}
.grid .hd.today{color:var(--accent)}
.grid .tm{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:right;padding-right:4px;line-height:20px}
.grid .hd small{display:block;font-family:var(--f-mono);font-size:10px;font-weight:500}
.grid .hd.today{color:var(--accent-ink)}
.grid .hd.today span{display:inline-block;background:var(--accent);border-radius:8px;padding:1px 6px 2px}
.grid .tm.now{color:var(--accent);font-weight:700}
.cell.td{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.cell.td:not(.c-class):not(.c-fixed):not(.c-never):not(.c-confirmed){background:var(--accent-soft)}
.cell.nowc{box-shadow:0 0 0 2px var(--accent);position:relative;z-index:1}
.cell.nowc::after{content:"";position:absolute;left:-2px;right:-2px;height:2px;background:var(--bad);top:var(--nowpos,50%);border-radius:1px}
.cell{height:20px;border-radius:4px;background:var(--surface);border:1px solid var(--line)}
.editable .cell{cursor:crosshair}
.c-class{background:var(--accent);border-color:var(--accent)}
.c-fixed{background:var(--amber-soft);border-color:var(--amber)}
.c-never{border-color:var(--bad);background:repeating-linear-gradient(135deg,var(--bad-soft) 0 3px,var(--card) 3px 6px)}
.c-confirmed{background:var(--good);border-color:var(--good)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .cell{width:12px;height:12px;display:inline-block}

.upload{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--accent);border-radius:16px;padding:14px;background:var(--accent-soft);cursor:pointer;position:relative}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.upload svg{width:28px;height:28px;flex:none;color:var(--accent)}
.classlist{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.classlist div{display:flex;justify-content:space-between;gap:8px}
.classlist b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

.catgroup{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-size:11px;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:inherit;opacity:.8}

.sheet-wrap{position:absolute;inset:0;background:rgba(15,8,22,.45);display:flex;align-items:flex-end;z-index:30}
.sheet{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px 28px;display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.stepper output{font-family:var(--f-display);font-weight:800;font-size:46px;min-width:70px;text-align:center}
.aibox{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:13px}
.aibox .ai{font-family:var(--f-mono);font-size:10.5px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 6px;flex:none;margin-top:1px}

.rec{display:flex;flex-direction:column;gap:8px}
.rec .top{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.rec .top .time{color:var(--ink);font-weight:600;white-space:nowrap}
.rec .top .pill{margin-left:auto}
.rec .kw{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.05;letter-spacing:-.02em}
.rec .kw small{font-family:var(--f-body);font-weight:400;letter-spacing:0;font-size:13px;color:var(--muted);margin-left:6px}
.rec .meta{font-size:12.5px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap}
.rec .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rec .place{display:flex;gap:4px;align-items:center;font-size:12.5px;min-width:0}
.rec .place span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .place svg{width:14px;height:14px;flex:none;color:var(--accent)}
.rec.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.empty{text-align:center;padding:22px 12px;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:16px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--good);transition:width .4s}

.banner{position:absolute;left:10px;right:10px;top:56px;z-index:25;animation:drop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-120%)}}
.banner-in{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 18px 40px -18px rgba(30,10,50,.5);display:flex;flex-direction:column;gap:6px}
.banner .b-app{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}

.banner .b-title{font-weight:600}
.banner .b-actions{display:flex;gap:8px;margin-top:2px}

.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--surface);font-size:13px;padding:9px 14px;border-radius:12px;max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}

.backbar{display:flex;align-items:center;gap:6px}
.backbar button{border:0;background:none;padding:6px 6px 6px 0;display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:600}
.members{display:flex;flex-wrap:wrap;gap:8px}
.mem{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px}
.mem i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:#fff}
.mem.me{border-color:var(--accent)}
.map{display:block;width:100%;height:auto;border-radius:14px}
.route{display:grid;grid-template-columns:20px 1fr;gap:4px 10px;font-size:13px}
.route .dotm{width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:3px}
.route .doto{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--accent);margin-top:3px}
.route .line{width:2px;height:14px;margin-left:6px;background:repeating-linear-gradient(var(--accent) 0 3px,transparent 3px 6px)}
.demo-act{border:1px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.demo-act .eyebrow{color:var(--amber)}

.optgrid{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatch.on{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.15;letter-spacing:-.02em}
.hintlist{display:flex;flex-direction:column;gap:6px}
.hintlist div{display:flex;gap:8px;align-items:baseline;font-size:14px}
.hintlist .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none;width:44px}
.hintlist .locked{color:var(--muted)}
.targets{display:flex;gap:6px;flex-wrap:wrap}

.glow{position:absolute;inset:0;z-index:50;background:var(--glow);color:var(--glow-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
.glow::before{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:pulse 1.1s ease-in-out infinite alternate;pointer-events:none}
.glow>*{position:relative}
.glow .big{font-family:var(--f-display);font-weight:800;font-size:60px;line-height:.95;letter-spacing:-.03em}
.glow .nick{font-family:var(--f-display);font-weight:600;font-size:24px}
.glow .btn{background:var(--glow-ink);color:var(--glow)}
.glow .found{background:rgba(255,255,255,.55);border-radius:14px;padding:10px 14px;font-weight:600}
@keyframes pulse{to{opacity:.38}}

.guide{width:300px;flex:none;display:flex;flex-direction:column;gap:14px;padding-top:24px}
.guide h2{font-size:22px}
.guide ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.guide li{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 10px;border-radius:12px;font-size:13.5px;align-items:start}
.guide li .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:1px}
.guide li.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.guide li.now{background:var(--card);border:1px solid var(--line)}
.guide li small{display:block;color:var(--muted);font-size:12px}
.guide .ai-state{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

@media (max-width:860px){.guide{display:none}}
@media (max-width:600px){
  body{padding-block:0}
  .phone{width:100%;height:100%;border-width:0;border-radius:0;box-shadow:none}
  .statusbar,.island,.homebar{display:none}
  .tabbar{padding-bottom:env(safe-area-inset-bottom,0px)}
  .banner{top:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* matches the current app */
.cattabs{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;margin:-2px -14px 2px;padding:0 14px;border-bottom:1px solid var(--line);-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
.cattabs::-webkit-scrollbar{display:none}
.cattabs button{flex:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;padding:4px 0 10px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.cattabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.cattabs i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.addown{border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.chip.off{opacity:.45}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{min-height:64px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 6px;text-align:center;font:inherit;cursor:pointer}
.slot>span{font-size:20px;line-height:1;color:var(--accent);opacity:.7}
.slot small{font-size:11px}
.slot.filled{border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.slot.filled b{font-size:13.5px;line-height:1.2}
.slot.filled small{opacity:.8}
.next-check{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 4px;font-size:13px;color:var(--ink)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.next-in{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ring{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--accent) var(--p,0deg),var(--line) 0);-webkit-mask:radial-gradient(circle,transparent 3.5px,#000 4px);mask:radial-gradient(circle,transparent 3.5px,#000 4px)}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
.rec .invite{font-size:14px;line-height:1.35;margin:0}
.clockpill{user-select:none;-webkit-user-select:none;cursor:default;border:0;font:inherit}
.btn svg.home{width:20px;height:20px}
</style>
</head>

function applyClasses(list){
  for (const row of S.grid) for (let i = 0; i < NH; i++) if (row[i] === 'class') row[i] = null;
  S.classes = list;
  for (const c of list) {
    const d = DAY_EN[c.day]; if (d === undefined) continue;
    const [sh] = String(c.start).split(':').map(Number), [eh, em] = String(c.end).split(':').map(Number);
    if (isNaN(sh) || isNaN(eh)) continue;
    const last = em > 0 ? eh : eh - 1;
    for (let h = Math.max(H0, sh); h <= Math.min(H1 - 1, last); h++) S.grid[d][h-H0] = 'class';
  }
}
async function readAlbert(file){
  if (!file) return;
  S.parse = {state:'reading'}; render();
  await sampleReady;
  const lim = SAMPLE ? await SAMPLE.limits().catch(() => null) : null;
  if (!SAMPLE) { await new Promise(r => setTimeout(r, 2200)); applyClasses(SAMPLE_CLASSES); S.parse = {state:'done', src:'ai'}; render(); profileChanged(); return; }
  if (!lim || !lim.images) { S.parse = {state:'error', msg:'Claude is connected, but this view can’t send images (some app and phone views can’t). Try claude.ai in a desktop browser, or load the demo schedule to continue.'}; render(); return; }
  try {
    const arr = await SAMPLE.json(
      'This image is a screenshot of an NYU student\'s class schedule from the Albert student system. ' +
      'List every class meeting. Reply with only a JSON array like ' +
      '[{"course":"CSCI-UA 102 Data Structures","day":"Mon","start":"09:30","end":"10:45"}]. ' +
      'day must be one of Mon,Tue,Wed,Thu,Fri,Sat,Sun; times are 24-hour HH:MM. A class that meets on several days gets one entry per day. ' +
      'If the image is not a class schedule, reply [].', {images:[file]});
    const ok = Array.isArray(arr) ? arr.filter(c => c && DAY_EN[c.day] !== undefined && /^\d{1,2}:\d{2}$/.test(c.start) && /^\d{1,2}:\d{2}$/.test(c.end)).map(c => ({course:String(c.course || 'Class').slice(0,60), day:c.day, start:c.start, end:c.end})) : [];
    if (!ok.length) S.parse = {state:'error', msg:'No classes found in that image. Take a screenshot that shows days and times.'};
    else { applyClasses(ok); S.parse = {state:'done', src:'ai'}; }
  } catch (e) { S.parse = {state:'error', msg: aiError(e && e.code)}; }
  render();
}
// cross streets on the sketch map, so a place Claude names can be pinned roughly where it is
const NS_X = {'6th Ave':30, 'MacDougal St':96, 'Thompson St':156, '5th Ave':168, 'University Pl / LaGuardia Pl':240, 'Mercer St':296, 'Broadway':336};
const EW_Y = {'W 8th St':24, 'Waverly Pl':60, 'W 4th St':190, 'W 3rd St':222, 'Bleecker St':252};
function placeFromVenue(key, v){
  let x = (NS_X[v.ns] ?? 168) + 6, y = (EW_Y[v.ew] ?? 222) + 8;
  const far = ['N','S','E','W'].includes(v.far) ? v.far : '';
  if (far === 'N') y = 10; if (far === 'S') y = 252; if (far === 'E') x = 344; if (far === 'W') x = 12;
  x = Math.max(10, Math.min(346, x)); y = Math.max(10, Math.min(252, y));
  const name = String(v.name || 'Suggested spot').slice(0, 40), tag = name.length > 18 ? name.slice(0, 17) + '…' : name;
  const id = 'ai_' + key.replace(/[^a-z0-9]+/g, '_');
  PLACES[id] = {name, tag: far ? `${tag} ${({N:'↑',S:'↓',E:'→',W:'←'})[far]}` : tag,
    addr: String(v.address || 'near Washington Square').slice(0, 60), campus:false, x, y, side: x < 250 ? 'r' : 'l',
    ai:true, sure: v.confident !== false, far};
  return id;
}
async function thinkAbout(name){
  await sampleReady;
  if (!SAMPLE) return {info:null, err:'none'};
  const meets = Object.entries(PLACES).filter(([,p]) => p.campus).map(([k,p]) => `${k} = ${p.name}`).join('; ');
  const known = Object.entries(PLACES).filter(([,p]) => !p.ai).map(([k,p]) => `${k} = ${p.name} (${p.addr})`).join('; ');
  const prompt = `You help run Nado, an app that puts NYU students who are strangers into small groups when they are free at the same time and share an interest. ` +
    `A student just added a new interest: "${name}". Think it through carefully before you answer:\n` +
    `1. What is this activity, and which category fits best: ${CATS.join(', ')}?\n` +
    `2. What is the largest group of strangers that really works for it? Weigh practical limits: buying seats or tickets together, table size, court or equipment size, cost, noise, and whether a big group of strangers would feel awkward. When unsure, pick the smaller number. Range 2 to 12.\n` +
    `3. What is a sensible default minimum group size (at least 2, not above the maximum)?\n` +
    `4. Where should the group first meet on campus? Choose one key: ${meets}.\n` +
    `5. Where does the activity actually happen? If one of these known places fits well, set "place" to its key: ${known}. ` +
    `Otherwise set "place" to null and suggest one real venue near NYU's Washington Square campus in "venue": its name, street address, ` +
    `the nearest north-south street (one of: ${Object.keys(NS_X).join(', ')}) as "ns", and the nearest east-west street (one of: ${Object.keys(EW_Y).join(', ')}) as "ew". ` +
    `If it is more than about a 10-minute walk from Washington Square Park, set "far" to its compass direction from the park (N, S, E or W), otherwise "". ` +
    `Only name a specific business you are confident exists; if you are not sure, describe a generic public spot instead (for example "Washington Square Park lawn") and set "confident" to false.\n` +
    `6. Write a reason of one or two plain sentences, addressed to the student, explaining the group size and the place.\n` +
    `Reply with only a JSON object like {"label":"Badminton","cat":"Sports","max":4,"min":2,"meet":"paulson","place":null,` +
    `"venue":{"name":"...","address":"...","ns":"Mercer St","ew":"W 3rd St","far":"","confident":true},"reason":"..."}. The label is at most 4 words.`;
  try {
    const v = await SAMPLE.json(prompt, {modelTier:'default', cache:false});
    if (!v || !CATS.includes(v.cat)) return {info:null, err:'invalid'};
    const max = Math.max(2, Math.min(12, Math.round(Number(v.max)) || 4));
    const meet = PLACES[v.meet] && PLACES[v.meet].campus ? v.meet : CAT_MEET[v.cat];
    let dest = PLACES[v.place] && !PLACES[v.place].ai ? v.place : null;
    if (!dest && v.venue && v.venue.name) dest = placeFromVenue(name.toLowerCase(), v.venue);
    return {info:{label:String(v.label || name).slice(0,40), cat:v.cat, max,
      min: Math.max(2, Math.min(max, Math.round(Number(v.min)) || 2)), meet, dest: dest || CAT_DEST[v.cat],
      reason: String(v.reason || '').slice(0,320), byAI:true}};
  } catch (e) { return {info:null, err: e && e.code}; }
}
async function addCustom(raw, force){
  if (!force) {
    if (!raw.trim()) return;
    if (S.tastes.length >= MAX_INT) { S.custom = {state:'error', msg:FULL_MSG}; render(); return; }
    const ck = checkName(raw); if (ck.err) { S.custom = {state:'error', msg:ck.err}; render(); return; }
    raw = ck.name;
  }
  const name = raw.trim().slice(0,40); if (!name) return;
  const key = name.toLowerCase();
  if (KW[key] && !force) { openSheet(key); return; }
  S.sheet = null; S.custom = {state:'busy', name, msg:''}; render();
  const {info, err} = await thinkAbout(name);
  const fin = info || {label:name, cat:'Other', max:4, min:2, meet:'kimmel', dest:'wsp', reason:''};
  KW[key] = {...fin, name, minDef: fin.min};
  S.catTab = fin.cat;
  const t = S.tastes.find(t => t.kw === key);
  if (t) { t.cat = fin.cat; t.min = Math.min(t.min, fin.max); }
  S.custom = info ? {state:'idle', msg:`Claude thought it through: ${fin.cat} · up to ${fin.max} people`}
    : {state:'error', msg: (err === 'none' ? 'Claude isn’t connected in this view.' : aiError(err)) + ' Added with defaults (Other, max 4).'};
  openSheet(key);
  if (t) profileChanged();
}

function cancelMember(key){
  const r = S.recs[key]; if (!r || !r.members.length) return;

  S.excluded[key] = [...(S.excluded[key] || []), gone.id];
  const size = r.members.length + 1, tm = teamMinOf(r);
  if (size >= tm) { toast(`${seedById(gone.id).nick} cancelled. Still ${size} (min ${tm})`); render(); return; }
  r.status = 'dissolved';
  S.history.push({...r});
  delete S.recs[key];
  S.confirmed = S.confirmed.filter(k => k !== key);
  S.flags.dissolve = true;
  S.view = null; S.game = null; S.tab = 'groups';
  render(); toast(`Down to ${size}, below the minimum. Room dissolved; rematching that hour`);
  S.rematch.push(key);
  later(() => {
    recompute();
    S.rematch = S.rematch.filter(k => k !== key);
    const nr = S.recs[key];
    if (nr && nr.status === 'new') { S.pushed = S.pushed.filter(k => k !== key); push(nr, 'Rematched: a new team for the same hour'); }

}

}

/* ---------- events ---------- */
const phone = $('#phone');
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, key = b.dataset.key;
  switch (a) {
    case 'to-login': S.step = 'login'; S.codeErr = ''; render(); break;
    case 'resend': toast(`New code sent to ${S.email} (demo)`); break;
    case 'sample-sched': applyClasses(SAMPLE_CLASSES); S.parse = {state:'done', src:'sample'}; render(); profileChanged(); break;
    case 'mode': S.mode = b.dataset.mode; render(); break;
    case 'to-taste': S.step = 'taste'; render(); $('#screen').scrollTop = 0; break;
    case 'kw': { const k = b.dataset.kw; if (!S.tastes.some(t => t.kw === k) && S.tastes.length >= MAX_INT) { toast(FULL_MSG); break; } openSheet(k); break; }
    case 'cattab': S.catTab = b.dataset.cat; render(); break;
    case 'to-browse': { const el = document.getElementById('browse'); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); break; }
    case 'clocktap': { const t = Date.now(); clockTaps = clockTaps.filter(x => t - x < 2000).concat(t); if (clockTaps.length >= 5) { clockTaps = []; S.clockSheet = true; render(); } break; }
    case 'clock-preset': setClock(b.dataset.id); afterClock(); break;
    case 'clock-real': setClock('real'); afterClock(); break;
    case 'clock-set': { const dv = $('#ckdate').value, tv = $('#cktime').value; if (!dv || !tv) break; const base = new Date(`${dv}T${tv}`); if (isNaN(base)) break; clock = {id:'custom', base, set:Date.now()}; afterClock(); break; }
    case 'leave': {
      const r = S.recs[key]; if (!r) break;
      delete S.recs[key]; S.confirmed = S.confirmed.filter(k => k !== key); S.left[key] = true;
      S.view = null; S.game = null; S.tab = 'groups'; render(); toast('You left the group'); break; }
    case 'home': S.game = null; S.view = null; S.tab = 'inbox'; S.flags.found = true; render(); $('#screen').scrollTop = 0; break;
    case 'min-dec': S.sheet.min = Math.max(2, S.sheet.min - 1); render(); break;
    case 'min-inc': S.sheet.min = Math.min(kwInfo(S.sheet.kw).max, S.sheet.min + 1); render(); break;
    case 'sheet-close': S.sheet = null; render(); break;
    case 'sheet-save': {
      const t = S.tastes.find(t => t.kw === S.sheet.kw);
      if (!t && S.tastes.length >= MAX_INT) { toast(FULL_MSG); break; }
      if (t) t.min = S.sheet.min; else S.tastes.push({kw:S.sheet.kw, cat:catOf(S.sheet.kw), min:S.sheet.min});
      S.sheet = null; render(); profileChanged(); break; }
    case 'sheet-remove': S.tastes = S.tastes.filter(t => t.kw !== S.sheet.kw); S.sheet = null; render(); profileChanged(); break;
    case 'start': startApp(); break;
    case 'tab': S.tab = b.dataset.tab; S.view = null; S.highlight = null; render(); $('#screen').scrollTop = 0; break;
    case 'nado': nado(key); break;
    case 'banner-close': hideBanner(); break;
    case 'banner-open': hideBanner(); S.tab = 'inbox'; S.view = null; S.highlight = key; render();
      { const el = document.getElementById('rec-' + key); if (el) el.scrollIntoView({block:'center'}); } break;
    case 'run-match': { recompute(); const r = pushNext('A plan fits the next few hours'); if (!r) toast('No new plans for the next 4 hours'); render(); break; }
    case 'confirm': { const r = S.recs[key]; if (r) { r.meConfirmed = true; maybeOpen(r); render(); } break; }
    case 'open-room': S.view = {type:'room', key}; S.flags.map = true; render(); $('#screen').scrollTop = 0; choosePlace(S.recs[key]); break;
    case 'back':
      if (S.view && S.view.type === 'game') { S.view = {type:'room', key:S.view.key}; S.game = null; }
      else S.view = null;
      render(); break;
    case 'cancel-member': cancelMember(key); break;
    case 'pre-meet': {
      const r = S.recs[key];
      S.game = {key, phase:'outfit', outfit:{color:'', top:'', shoes:'', hair:''}, targets: r.members.slice(0,3).map(m => ({id:m.id, found:false, hint:0})), idx:0, dunno:0, question: questionsFor(r.kw)[0], qi:0};
      S.view = {type:'game', key}; render(); $('#screen').scrollTop = 0; break; }
    case 'outfit': S.game.outfit[b.dataset.k] = b.dataset.v; render(); break;
    case 'send-outfit': S.game.phase = 'hunt'; render(); toast('Outfit sent to the AI. Your group hints are here'); break;
    case 'found': {
      const g = S.game; g.targets[g.idx].found = true;
      const n = g.targets.findIndex(t => !t.found);
      if (n < 0) { g.phase = 'done'; S.flags.found = true; } else g.idx = n;
      render(); break; }
    case 'dunno': { const g = S.game, t = g.targets[g.idx]; g.dunno++; if (t.hint < 2) t.hint++; render(); break; }
    case 'giveup': {
      const g = S.game; g.phase = 'glow'; g.foundBy = ''; S.flags.glow = true; render();
      const t = g.targets.find(t => !t.found);
      later(() => { if (S.game === g && g.phase === 'glow') { g.foundBy = seedById(t.id).nick; render(); } }, 3200);
      break; }
    case 'glow-done': S.game.targets.forEach(t => t.found = true); S.game.phase = 'done'; S.flags.found = true; render(); break;
    case 'new-q': newQuestion(); break;
    case 'rethink': { const k = S.sheet.kw; addCustom((KW[k] && KW[k].name) || k, true); break; }
    case 'quick': quickSetup(); break;
    case 'reset': timers.forEach(clearTimeout); timers = []; hideBanner(); S = freshState(); render(); break;
    case 'sheet-bg': break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') {
    const v = $('#email').value.trim();
    S.email = v;
    if (!/^[a-z0-9._%+-]+@nyu\.edu$/i.test(v)) { S.loginErr = 'Use your NYU email (ending in @nyu.edu).'; render(); return; }
    S.loginErr = ''; S.codeErr = ''; S.step = 'verify'; render(); toast(`Code sent to ${v} (demo)`);
  }
  if (e.target.id === 'codeForm') {
    const code = [0,1,2,3,4,5].map(i => ($('#code' + i).value || '').trim()).join('');
    if (!/^\d{6}$/.test(code)) { S.codeErr = 'Enter all 6 digits.'; render(); return; }
    S.codeErr = ''; startApp('me'); toast('Verified. Set up your profile to get matched');
  }
  if (e.target.id === 'customForm') addCustom($('#customKw').value);
});
document.addEventListener('input', e => {
  const m = e.target.id && e.target.id.match(/^code(\d)$/); if (!m) return;
  const i = +m[1], v = e.target.value.replace(/\D/g, '');
  if (v.length > 1) { // pasted or autofilled several digits
    v.slice(0, 6 - i).split('').forEach((ch, j) => { const el = $('#code' + (i + j)); if (el) el.value = ch; });
    const nx = $('#code' + Math.min(5, i + v.length)); if (nx) nx.focus();
  } else {
    e.target.value = v;
    if (v && i < 5) $('#code' + (i + 1)).focus();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.sheet || S.clockSheet)) { S.sheet = null; S.clockSheet = false; render(); }
  const m = e.target.id && e.target.id.match(/^code(\d)$/);
  if (m && e.key === 'Backspace' && !e.target.value && +m[1] > 0) $('#code' + (+m[1] - 1)).focus();
});
document.addEventListener('change', e => {
  if (e.target.id === 'albert') readAlbert(e.target.files && e.target.files[0]);
  if (e.target.id === 'democlock') { setClock(e.target.value); tick(); if (S.step === 'app') { recompute(); render(); later(() => { pushNext('A plan fits the next few hours'); render(); }, 600); } else render(); toast('Clock set to ' + CLOCKS.find(c => c.id === clock.id).label.split(' · ')[0]); }
  if (e.target.id === 'notif') { S.notifOn = e.target.checked; if (!S.notifOn) hideBanner(); toast(S.notifOn ? 'Match notifications on' : 'Notifications off. Matches still land in your inbox'); }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') { S.sheet = null; S.clockSheet = false; render(); } });
document.addEventListener('mousedown', e => { if (e.detail > 1 && e.target.closest('[data-act="clocktap"]')) e.preventDefault(); });

/* grid painting */
let paint = null;
function applyCell(cell, d, h, val){
  const cur = S.grid[d][h];
  if (cur === val || cell.classList.contains('c-confirmed')) return;
  if (cur === 'class' && val !== null) return;
  S.grid[d][h] = val; paint.changed = true;
  cell.className = 'cell' + (cell.dataset.x || '') + (val ? ' c-' + val : '');
}
phone.addEventListener('pointerdown', e => {
  const cell = e.target.closest('.grid.editable .cell[data-d]'); if (!cell) return;
  e.preventDefault();
  const d = +cell.dataset.d, h = +cell.dataset.h, cur = S.grid[d][h];
  const val = S.mode === 'erase' ? null : (cur === S.mode ? null : S.mode);
  paint = {val, changed:false};
  applyCell(cell, d, h, val);
  try { cell.closest('.grid').setPointerCapture(e.pointerId); } catch (_) {}
});
phone.addEventListener('pointermove', e => {
  if (!paint) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el && el.closest && el.closest('.grid.editable .cell[data-d]');
  if (cell) applyCell(cell, +cell.dataset.d, +cell.dataset.h, paint.val);
});
const endPaint = () => { if (!paint) return; const ch = paint.changed; paint = null; if (ch) { renderGuide(); profileChanged(); } };
window.addEventListener('pointerup', endPaint);
window.addEventListener('pointercancel', endPaint);

let clockTaps = [];
function afterClock(){
  S.clockSheet = false; tick();
  if (S.step === 'app') { recompute(); render(); later(() => { pushNext('A plan fits the next few hours'); render(); }, 600); } else render();
  toast(clock.base ? 'Clock moved' : 'Back to real time');
}
let lastMinute = Math.floor(Date.now() / 60000);
setInterval(() => {
  const ms = Date.now(), left = 60000 - (ms % 60000), el = document.getElementById('nextcheck');
  if (el) {
    el.querySelector('.ring').style.setProperty('--p', `${Math.round((1 - left / 60000) * 360)}deg`);
    el.querySelector('.next-in .mono').textContent = `00:${String(Math.ceil(left / 1000) % 60).padStart(2, '0')}`;
  }
  const m = Math.floor(ms / 60000);
  if (m !== lastMinute) {
    lastMinute = m;
    if (S.step === 'app' && !S.sheet && !S.clockSheet) { recompute(); const r = pushNext('A plan fits the next few hours'); if (r || S.tab === 'inbox') render(); }
  }
}, 1000);
function tick(){ const n = now(); $('#clock').textContent = `${h12(n.getHours())}:${String(n.getMinutes()).padStart(2,'0')}`; }
tick(); setInterval(tick, 20000);

render();
})();
</script>

</body>
